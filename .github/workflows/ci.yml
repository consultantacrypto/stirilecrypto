name: CI

on:
  pull_request:
  push:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: node --test scripts/wallets-sync-compare.test.mjs
      - run: npx tsx --test $(find lib -name '*.test.ts' -print)
      - run: npm run check:wallets-sync
